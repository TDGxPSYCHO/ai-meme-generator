<!DOCTYPE html>
<html>
<head>
    <title>AI Meme Generator</title>
</head>
<body>
    <h1>Create a Meme</h1>
    <form method="POST">
        <input type="text" name="topic" placeholder="Enter a meme topic">
        <button type="submit">Generate</button>
    </form>
    {% if meme_path %}
        <h2>Your Meme:</h2>
        <img src="{{ meme_path }}" width="500">
    {% endif %}
</body>
</html>
